# =====================================================================
# Customer Churn Analysis - configuration
# =====================================================================
project:
  name: Customer Churn Analysis
  version: "1.0.0"

# Which dataset drives the deep analysis. Options: telco | bank
dataset:
  name: telco

# Modelling
model:
  test_size: 0.20
  random_state: 42
  cv_folds: 5

# Business impact
impact:
  # Cost of acquiring one new customer, as a multiple of the monthly margin
  cac_multiple: 4.0
  # Margin per unit of monthly revenue (used to turn revenue into profit)
  margin_pct: 0.35

# Reporting
reporting:
  top_n: 10
  excel_file: "reports/Churn_Analysis.xlsx"
  pdf_file: "reports/Churn_Report.pdf"
