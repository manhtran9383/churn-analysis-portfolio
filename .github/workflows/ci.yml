name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    strategy:
      matrix:
        dataset: [telco, bank]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "streamlit>=1.40" pytest "nbformat>=5.10" "nbclient>=0.8" "ipykernel>=6.25"

      - name: Debug before run
        shell: bash
        run: |
          echo "Working directory: $(pwd)"
          echo "Python: $(python --version)"
          echo "Files in cwd: $(ls -la)"
          echo "src/ exists: $(test -d src && echo yes || echo no)"
          echo "src/run_churn_analysis.py exists: $(test -f src/run_churn_analysis.py && echo yes || echo no)"
          echo "data/raw/ exists: $(test -d data/raw && echo yes || echo no)"
          echo "data/raw/Telco-Customer-Churn.csv exists: $(test -f data/raw/Telco-Customer-Churn.csv && echo yes || echo no)"
          echo "data/raw/Churn_Modelling.csv exists: $(test -f data/raw/Churn_Modelling.csv && echo yes || echo no)"
          python -c "import sys; print('Python path:'); [print(p) for p in sys.path]"

      - name: Run pipeline
        shell: bash
        run: |
          python src/run_churn_analysis.py --dataset ${{ matrix.dataset }}
        continue-on-error: true

      - name: Run tests
        shell: bash
        run: |
          pytest tests -q --cov=src --cov-report=term-missing

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.dataset }}
          path: |
            reports/Churn_Analysis.xlsx
            reports/figures/
          retention-days: 30
