name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Runs on Windows (the user's environment) so path handling and the full
# pipeline are verified the same way the user runs them locally.
jobs:
  verify:
    runs-on: windows-latest
    strategy:
      matrix:
        dataset: [telco, bank]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "streamlit>=1.40" pytest "nbformat>=5.10" "nbclient>=0.8" "ipykernel>=6.25"

      - name: Run pipeline  --dataset telco
        run: python -m src.run_churn_analysis --dataset telco
        if: matrix.dataset == 'telco'

      - name: Run pipeline  --dataset bank
        run: python -m src.run_churn_analysis --dataset bank
        if: matrix.dataset == 'bank'

      - name: Run tests
        run: pytest tests -q --cov=src --cov-report=term-missing

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.dataset }}
          path: |
            reports/Churn_Analysis.xlsx
            reports/figures/
          retention-days: 30
