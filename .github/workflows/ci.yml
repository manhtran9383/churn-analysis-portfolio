name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    strategy:
      matrix:
        dataset: [telco, bank, hr]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pipeline
        run: python -m src.run_churn_analysis --dataset ${{ matrix.dataset }}

      - name: Run tests
        run: pytest tests -q --tb=short

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.dataset }}
          path: |
            reports/Churn_Analysis.xlsx
            reports/figures/
          retention-days: 30

  check-preview:
    runs-on: windows-latest
    strategy:
      matrix:
        dataset: [telco, bank, hr]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Build preview HTML (validates figure embedding)
        run: python -m src.run_churn_analysis --dataset ${{ matrix.dataset }} --stage preview

      - name: Assert preview embeds 6 figures
        run: |
          python -c "
          ds = '${{ matrix.dataset }}'
          f = f'powerbi/dashboard_preview_{ds}.html'
          html = open(f, encoding='utf-8').read()
          n = html.count('data:image/png;base64')
          if n != 6:
              raise SystemExit(f'{ds}: {n} base64 images in preview, expected 6')
          print(f'{ds}: preview OK ({n} base64 figures)')
          "
