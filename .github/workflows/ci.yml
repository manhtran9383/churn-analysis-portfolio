name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    strategy:
      matrix:
        dataset: [telco, bank]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "streamlit>=1.40" pytest "nbformat>=5.10" "nbclient>=0.8" "ipykernel>=6.25"

      - name: Run pipeline
        shell: bash
        run: |
          python src/run_churn_analysis.py --dataset ${{ matrix.dataset }}

      - name: Run tests
        shell: bash
        run: |
          pytest tests -q --tb=short

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.dataset }}
          path: |
            reports/Churn_Analysis.xlsx
            reports/figures/
          retention-days: 30
